<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#312e81">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>منزل · إدارة المصاريف</title>
<link rel="icon" type="image/svg+xml" href="img/logo.svg">
<link rel="apple-touch-icon" href="img/logo.svg">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="bg-bubbles" id="bgBubbles" aria-hidden="true"></div>

  <div class="phone" id="phone">
    <div class="app">
      <header class="topbar">
        <button class="icon-btn" id="menuBtn" aria-label="القائمة"></button>
        <div class="topbar-title" id="pageTitle">الرئيسية</div>
        <button class="icon-btn" id="themeBtn" aria-label="الوضع الليلي"></button>
        <button class="icon-btn" id="settingsBtn" aria-label="الإعدادات"></button>
      </header>

      <main id="view" class="view" tabindex="-1"></main>

      <nav class="dock" id="dock" aria-label="التنقل السريع"></nav>
    </div>

    <aside class="sidebar" id="sidebar" aria-label="التصنيفات">
      <div class="side-head">
        <div class="brand">
          <span class="brand-orb" id="brandLogo"></span>
          <div class="brand-txt"><b>منزل</b><small>إدارة مصاريفك</small></div>
        </div>
        <button class="icon-btn ghost" id="closeSidebar" aria-label="إغلاق"></button>
      </div>
      <nav class="side-nav" id="sideNav"></nav>
      <div class="side-foot">
        <button class="side-action" id="backupBtn"></button>
        <button class="side-action" id="settingsBtn2"></button>
      </div>
    </aside>

    <div class="scrim" id="scrim"></div>

    <div class="sheet-wrap" id="sheetWrap" aria-hidden="true">
      <div class="sheet-scrim" data-close="1"></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
    </div>

    <div class="toast" id="toast" role="status"></div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/util.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
